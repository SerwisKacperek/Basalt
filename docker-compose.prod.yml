services:
  nginx:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"   
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - prod_network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 8000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-basalt}
      DB_DIALECT: postgresql
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prod_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/api/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-basalt}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - prod_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-basalt}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  prod_network:
    driver: bridge

volumes:
  postgres_prod_data: {}